server:
  port: ${PORT:8080}
  servlet:
    context-path: /badbook

spring:
  application:
    name: badbook
  profiles:
    include: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/badbook}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    defer-datasource-initialization: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect


  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
        shutdown-timeout: 100ms

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes in ms

  # Flyway Configuration
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  main:
    banner-mode: "off"

  output:
    ansi:
      enabled: ALWAYS

logging:
  level:
    root: WARN
    "com.example.bigfood": INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

app:
  url: ${APP_URL:http://localhost:8080}
  cors:
    allowed-origin-pattern: ${FE_DOMAIN:http://localhost:3000}

vnpay:
  payUrl: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
  returnUrl: "${app.url}/badbook/api/payments/vnpay-callback"
  tmnCode: ${VNPAY_TMN_CODE:TESTCODE}
  secretKey: ${VNPAY_SECRET_KEY:testsecretkey12345678901234567890}

cloudinary:
  cloudName: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
  apiKey: ${CLOUDINARY_API_KEY:your-api-key}
  apiSecret: ${CLOUDINARY_API_SECRET:your-api-secret}

goong:
  api:
    key: ${GOONG_API_KEY:your-goong-key}
    base-url: https://rsapi.goong.io
