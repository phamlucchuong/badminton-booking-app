name: CI BACKEND
on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'src/**'
      - 'pom.xml'
jobs:
  test-user:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Auth Tests
        run: |
          mvn clean verify