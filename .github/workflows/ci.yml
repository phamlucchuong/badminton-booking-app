name: CI BACKEND
on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'backend/.mvn/**'
      - 'backend/mvnw'
      - 'backend/src/**'
      - 'backend/pom.xml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'backend/.mvn/**'
      - 'backend/mvnw'
      - 'backend/src/**'
      - 'backend/pom.xml'
jobs:
  test-user:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Auth Tests
        run: |
          ./backend/mvnw -f backend/pom.xml clean verify
